// extra-java-module-info configuration for the client side jasper reports dependencies,
// giving xmpcore, a plain jar the pdf export module depends on, a module name
plugins {
    id("org.gradlex.extra-java-module-info")
}

extraJavaModuleInfo {
    automaticModule("com.adobe.xmp:xmpcore", "com.adobe.xmp.xmpcore")
}