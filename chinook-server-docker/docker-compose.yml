services:
  chinook-server:
    image: chinook-server:latest
    container_name: chinook-server
    ports:
      - "1098:1098"  # RMI registry port
      - "2223:2223"  # Server port (RMI)
      - "4445:4445"  # Admin port
      - "8088:8088"  # HTTP servlet port
    environment:
      # The jlink launcher hardcodes its JVM args (incl. -Xmx512m) and ignores JAVA_OPTS; _JAVA_OPTIONS is the
      # one env var the JVM applies last, so it's what actually overrides the baked heap. Adjust to taste.
      - _JAVA_OPTIONS=-Xmx512m
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - chinook-network

networks:
  chinook-network:
    driver: bridge